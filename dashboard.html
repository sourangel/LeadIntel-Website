<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Dashboard | LeadIntel CRM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#040910">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>

<a class="sr-only" href="#leads">Skip to lead queue</a>

<header class="site-header app-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html" aria-label="LeadIntel CRM home">
      <img class="logo-mark" src="assets/logo-mark-128.png" width="34" height="34" alt="" aria-hidden="true" decoding="async">
      <span class="logo-word">LeadIntel</span>
    </a>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" type="button" data-signout>Sign out</button>
    </div>
  </div>
</header>

<main>

  <div class="wrap dash-head">
    <p class="eyebrow"><span class="dot"></span>Live lead queue</p>
    <h1 class="h-lg">Your leads, ranked.</h1>
    <p class="account" data-account>—</p>
  </div>

  <div class="wrap">
    <div class="dash-stats">
      <div class="dash-stat">
        <div class="value" data-stat="hot">0</div>
        <div class="label">Hot leads</div>
      </div>
      <div class="dash-stat">
        <div class="value" data-stat="warm">0</div>
        <div class="label">Warm leads</div>
      </div>
      <div class="dash-stat">
        <div class="value" data-stat="total">0</div>
        <div class="label">Total leads</div>
      </div>
      <div class="dash-stat">
        <div class="value" data-stat="pipeline">$0</div>
        <div class="label">Est. pipeline</div>
      </div>
    </div>

    <div class="toolbar">
      <label class="sr-only" for="sort">Sort leads</label>
      <select class="select" id="sort" data-sort>
        <option value="priority">Priority, then score</option>
        <option value="score">Highest score first</option>
        <option value="created">Newest first</option>
        <option value="value">Estimated value</option>
      </select>

      <button class="toggle-archived" type="button" data-archived-toggle aria-pressed="false">
        <span class="box" aria-hidden="true"></span>Show archived
      </button>

      <div class="filters" role="group" aria-label="Filter by priority">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-filter="hot" aria-pressed="false">Hot</button>
        <button class="chip" type="button" data-filter="warm" aria-pressed="false">Warm</button>
        <button class="chip" type="button" data-filter="cold" aria-pressed="false">Cold</button>
      </div>
    </div>

    <p class="result-count" role="status" data-count>Loading your leads…</p>

    <div class="lead-list" id="leads" data-list></div>
  </div>

</main>

<script src="assets/dashboard.js"></script>
</body>
</html>
